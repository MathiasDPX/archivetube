<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Video.js - Zone Ads sur la seekbar</title>
<link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />

<style>
  body {
    background: #111;
    color: #eee;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px;
  }

  .video-wrapper {
    width: 640px;
  }

  .vjs-ad-zone {
    position: absolute;
    top: 0;
    height: 100%;
    background-color: #00D400;
    z-index: 1;
    cursor: pointer;
    box-sizing: border-box;
  }

  .vjs-ad-zone .vjs-ad-tooltip {
    position: absolute;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    background: #000;
    color: #fff;
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 12px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s ease;
  }

  .vjs-ad-zone:hover .vjs-ad-tooltip {
    opacity: 1;
  }
</style>
</head>
<body>

<h2>test sponsorblock</h2>

<a href="https://wiki.sponsor.ajay.app/w/API_Docs">SponsorBlock API Docs</a>
<a href="https://sponsor.ajay.app/api/skipSegments/8c4e4caa">Sponsorblock API demo</a>

<div class="video-wrapper">
  <video
    id="mon-player"
    class="video-js vjs-default-skin"
    controls
    preload="auto"
    width="640"
    height="360"
    data-setup="{}"
  >
    <source src="./bbb.mp4" type="video/mp4" />
  </video>
</div>

<!-- Video.js JS -->
<script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

<script>
  const Component = videojs.getComponent('Component');

  class AdZone extends Component {
    constructor(player, options) {
      super(player, options);
      this.startTime = options.startTime;
      this.endTime = options.endTime;
      this.label = options.label || 'Ads';

      player.on('loadedmetadata', () => this.update());
      player.on('durationchange', () => this.update());
    }

    createEl() {
      const el = videojs.dom.createEl('div', {
        className: 'vjs-ad-zone'
      });

      const tooltip = videojs.dom.createEl('div', {
        className: 'vjs-ad-tooltip',
        textContent: this.options_.label || 'Ads'
      });

      el.appendChild(tooltip);
      return el;
    }

    update() {
      const duration = this.player().duration();
      if (!duration || isNaN(duration)) return;

      const left = (this.startTime / duration) * 100;
      const width = ((this.endTime - this.startTime) / duration) * 100;

      this.el_.style.left = left + '%';
      this.el_.style.width = width + '%';
    }
  }

  videojs.registerComponent('AdZone', AdZone);

  const player = videojs('mon-player');

  player.ready(() => {
    const seekBar = player.controlBar.progressControl.seekBar;

    const adZone = new AdZone(player, {
      startTime: 4 * 60, // start at 4 minutes
      endTime: 8 * 60, // ends at 8 minutes
      label: 'Ads'
    });

    seekBar.addChild(adZone);
    seekBar.el().appendChild(adZone.el());
  });
</script>

</body>
</html>
